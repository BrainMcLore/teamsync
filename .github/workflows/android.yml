name: Android verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/**', 'server/**', 'tools/account_fixture_server.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['client/**', 'server/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Analyze and unit tests
        working-directory: client
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Prepare isolated account fixture
        run: |
          mkdir -p .tools
          python -m pip install -r server/requirements.txt
          python tools/account_fixture_server.py > .tools/account-fixture.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android account and team integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb reverse tcp:8766 tcp:8766
            cd client && flutter test integration_test/accounts_android_test.dart -d emulator-5554
      - name: Build test APK
        working-directory: client
        run: flutter build apk --release --dart-define=TEAMSYNC_API_URL=https://teamsync-api-ui7n.onrender.com
      - name: Verify APK signature and package
        run: |
          mkdir -p dist
          cp client/build/app/outputs/flutter-apk/app-release.apk dist/TeamSync-Android-test.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose dist/TeamSync-Android-test.apk
          cd dist && sha256sum TeamSync-Android-test.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: teamsync-android-test-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
