name: Windows UI snapshots
on:
  push:
    branches: ['codex/ui-*']
  workflow_dispatch:
    inputs:
      hltv_only:
        description: 'Diagnose live HLTV using an already-built installer artifact'
        type: boolean
        default: false
      artifact_run:
        description: 'Windows release workflow run containing the installer artifact'
        type: string
        default: ''
      real_review:
        description: 'Include the pinned real CS2 recording in review UI acceptance'
        type: boolean
        default: false
      credential_smoke_only:
        description: 'Run only the native Windows credential adapter check'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  snapshots:
    if: inputs.credential_smoke_only != true && inputs.hltv_only != true
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        if: inputs.real_review == true
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Prepare pinned real review fixture
        if: inputs.real_review == true
        run: |
          python -m pip install -r worker/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Parser dependency installation failed.' }
          python tools/fetch_demo_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned recording verification failed.' }
          python tools/prepare_review_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Real review preparation failed.' }
      - name: Capture Windows UI for visual review
        working-directory: client
        run: flutter test --update-goldens test/studio_screens_test.dart
      - uses: actions/upload-artifact@v7
        with:
          name: windows-ui-snapshots-${{ github.sha }}
          path: client/test/goldens/windows/**/*.png
          if-no-files-found: error
          retention-days: 14

  native-credentials:
    if: inputs.hltv_only != true
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Compile and exercise the native credential adapter
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC toolchain missing.' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          cl /nologo /EHsc /std:c++17 /utf-8 tools/native_secure_storage_smoke.cpp /Fe:.tools/native-credential-check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native credential check compilation failed.' }
          & ./.tools/native-credential-check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native credential check failed.' }

  live-hltv:
    if: inputs.hltv_only == true
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install the verified candidate companion for isolated HLTV acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN: ${{ inputs.artifact_run }}
        run: |
          if ($env:ACCEPTANCE_RUN -notmatch '^\d+$') { throw 'A numeric Windows artifact run is required.' }
          $download = Join-Path $env:RUNNER_TEMP 'hltv-installer-artifact'
          gh run download $env:ACCEPTANCE_RUN --repo BrainMcLore/teamsync --pattern 'teamsync-windows-*' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact download failed.' }
          $installer = Get-ChildItem $download -Recurse -Filter '*-Windows-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Candidate installer missing.' }
          $manifestPath = Get-ChildItem $download -Recurse -Filter '*-manifest.json' | Select-Object -First 1
          $manifest = Get-Content $manifestPath.FullName -Raw | ConvertFrom-Json
          $entry = @($manifest.files | Where-Object name -EQ $installer.Name)
          if ($entry.Count -ne 1 -or (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry[0].sha256) { throw 'Candidate hash mismatch.' }
          $target = Join-Path $env:RUNNER_TEMP 'TeamSyncHltvAcceptance'
          $setup = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-', "/DIR=`"$target`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Candidate installation failed.' }
          $worker = Join-Path (Get-Location) '.tools/worker-dist/teamsync-demo'
          New-Item -ItemType Directory -Path $worker -Force | Out-Null
          Copy-Item (Join-Path $target 'demo-worker/*') -Destination $worker -Recurse -Force
          & (Join-Path $worker 'teamsync-download.exe') --check-runtime
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 runtime unavailable.' }
      - name: Diagnose native HLTV archive import
        working-directory: client
        env:
          TEAMSYNC_LIVE_HLTV: '1'
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }
          flutter test test/managed_hltv_05_test.dart --timeout=8m
          if ($LASTEXITCODE -ne 0) { throw 'Native HLTV acceptance failed; see the recorded error code.' }
