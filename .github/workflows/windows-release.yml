name: Windows release

on:
  workflow_dispatch:
    inputs:
      live_hltv:
        description: 'Run the real HLTV archive download/import acceptance (large network transfer)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-build.txt
            server/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Prepare Python and native tools
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r worker/requirements-build.txt -r server/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          $inno = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inno) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $inno = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          if (-not $inno) { throw 'Inno Setup compiler not found.' }
          "TEAMSYNC_ISCC=$($inno.FullName)" >> $env:GITHUB_ENV
      - name: Verify packaging and parser fixture
        run: |
          python -m unittest discover -s tools -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling checks failed.' }
          .venv/Scripts/python.exe tools/fetch_demo_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned demo fixture verification failed.' }
      - name: Build demo companion
        run: ./tools/build-demo-worker.ps1
      - name: Verify worker and server
        env:
          PYTHONPATH: worker
        run: |
          .venv/Scripts/python.exe -m pytest worker server/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Worker/server checks failed.' }
          .venv/Scripts/python.exe tools/prepare_review_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Real review preparation failed.' }
      - name: Build and verify Windows installer
        run: ./tools/build-windows.ps1 -Flutter (Get-Command flutter.bat).Source -Installer -InnoCompiler $env:TEAMSYNC_ISCC
      - name: Real HLTV archive download and native import
        if: inputs.live_hltv == true
        working-directory: client
        env:
          TEAMSYNC_LIVE_HLTV: '1'
        run: |
          flutter test test/managed_hltv_05_test.dart --timeout=8m
          if ($LASTEXITCODE -ne 0) { throw 'Live HLTV archive acceptance failed; do not certify external demo delivery.' }
      - name: Verify install, Beta upgrade, migration and uninstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'teamsync-published-beta'
          New-Item -ItemType Directory -Path $baseline | Out-Null
          gh release download v0.95.0-beta --repo BrainMcLore/teamsync --pattern 'TeamSync-0.95.0-beta-Windows-Setup.exe' --pattern 'TeamSync-0.95.0-beta-manifest.json' --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Published Beta download failed.' }
          $name = 'TeamSync-0.95.0-beta-Windows-Setup.exe'
          $manifest = Get-Content (Join-Path $baseline 'TeamSync-0.95.0-beta-manifest.json') -Raw | ConvertFrom-Json
          $entry = @($manifest.files | Where-Object name -EQ $name)
          if ($entry.Count -ne 1) { throw 'Baseline installer missing from published manifest.' }
          $old = Join-Path $baseline $name
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry[0].sha256) { throw 'Published installer hash mismatch.' }
          $candidate = Get-ChildItem dist/TeamSync-*-Windows-Setup.exe | Select-Object -First 1
          ./tools/check-windows-installer.ps1 -Candidate $candidate.FullName -Baseline $old
      - name: Package source, compatible server and checksums
        run: |
          python tools/package-source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed.' }
          python tools/package-server.py
          if ($LASTEXITCODE -ne 0) { throw 'Server packaging failed.' }
          python tools/release-checksums.py --require-windows
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: teamsync-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
